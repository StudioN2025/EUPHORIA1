<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family:'Manrope',sans-serif; color:#e8e6e1; }

  #ctrlHint { position:absolute; right:26px; bottom:calc(9vh + 22px); font-size:12px; letter-spacing:.12em;
              color:rgba(232,230,225,.55); text-transform:uppercase; opacity:0; transition:opacity .8s; }
  #ctrlHint.on { opacity:1; }

  #menu { z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:rgba(4,5,7,.62); backdrop-filter:blur(2px); pointer-events:auto;
          transition:opacity 1.1s ease; }
  #menu.off { opacity:0; pointer-events:none; }
  #menuKicker { font-size:12px; letter-spacing:.5em; color:#8a877f; text-transform:uppercase; margin-bottom:18px; }
  #menuTitle { font-family:'Unbounded'; font-weight:900; font-size:clamp(44px,9vw,110px);

  #menuTitle span { color:#ff4fa3; }
  #menuChapter { font-family:'Unbounded'; font-weight:400; margin-top:16px; font-size:clamp(14px,2vw,20px);

  #menuMeta { margin-top:34px; font-size:13px; letter-spacing:.14em; color:#79766f; text-transform:uppercase; }
  #startBtn { margin-top:38px; pointer-events:auto; cursor:pointer; background:none;
              border:1px solid #e8e6e1; color:#f2f0ea; padding:16px 54px;
              font-family:'Unbounded'; font-weight:700; font-size:14px; letter-spacing:.34em;
              text-transform:uppercase; transition:all .25s; }
  #startBtn:hover { background:#f2f0ea; color:#0a0a0a; }

  #fakeTitles { z-index:45; background:#000; display:none; flex-direction:column;

  #fakeTitles.reveal #ftEnd   { animation:ftIn 1.6s ease forwards; }
  #fakeTitles.reveal #ftThanks{ animation:ftIn 1.6s .5s ease forwards; }
  #fakeTitles.reveal #ftChoice{ animation:ftIn 1.6s 1.1s ease forwards; }
  @keyframes ftIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  #fakeTitles.flicker > div { animation-name:ftFlick !important; }
  @keyframes ftFlick {
    0%,100%{opacity:1} 8%{opacity:.15} 12%{opacity:1} 34%{opacity:.4}
    38%{opacity:1} 61%{opacity:.1} 65%{opacity:1} 82%{opacity:.5} 86%{opacity:1}
  }
  #fakeTitles.slide { transition:transform 2.3s cubic-bezier(.6,0,.2,1), opacity 2.3s ease;
                      transform:translateX(-58vw) skewX(-6deg); opacity:0; }

  #bluePost { z-index:46; background:#000; display:none; }
  #bluePost.on { display:block; }
  #blueScan { position:absolute; inset:0; background:repeating-linear-gradient(0deg,
              rgba(120,170,255,.03) 0 1px, transparent 1px 3px); }
  #blueText { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
              width:min(720px,84vw); font-family:'JetBrains Mono'; font-size:clamp(14px,2.1vw,20px);
              line-height:2.1; color:#7fb3ff; text-shadow:0 0 12px rgba(90,150,255,.35); white-space:pre-wrap; }
  #blueCur { display:inline-block; width:.6em; height:1em; background:#7fb3ff;
             vertical-align:-.15em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }

  #endCard { z-index:47; background:#000; display:none; flex-direction:column;
             align-items:center; justify-content:center; pointer-events:auto; }
  #endCard.on { display:flex; }
  #endTitle { font-family:'Unbounded'; font-weight:900; font-size:clamp(40px,8vw,100px);
              letter-spacing:.08em; color:transparent; -webkit-text-stroke:2px #f2f0ea; }
  #endSub { margin-top:20px; letter-spacing:.44em; text-transform:uppercase;
            font-size:clamp(12px,1.6vw,16px); color:#ff7ac2; font-weight:800; }
  #endNote { margin-top:14px; font-family:'JetBrains Mono'; font-size:12px; letter-spacing:.2em; color:#6f6d67; }
  #restartBtn { margin-top:46px; cursor:pointer; background:none; border:1px solid rgba(242,240,234,.55);
                color:#f2f0ea; padding:14px 44px; font-family:'Unbounded'; font-weight:700;
                font-size:12px; letter-spacing:.3em; text-transform:uppercase; transition:all .25s; }
  #restartBtn:hover { background:#f2f0ea; color:#000; }

  #stickUI { position:fixed; z-index:33; width:112px; height:112px; border-radius:50%;
             border:1px solid rgba(255,255,255,.28); display:none; pointer-events:none; }
  #stickKnob { position:absolute; left:50%; top:50%; width:44px; height:44px; border-radius:50%;
               background:rgba(255,255,255,.32); transform:translate(-50%,-50%); }
</style>

<!-- ИЗМЕНЕНО: ES-модуль вместо устаревшего three.min.js -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

/* =====================================================================
   EUPHORIA — Глава 1 «Крыша»
   ===================================================================== */

// ---------------------------------------------------------------- utils
const $=s=>document.querySelector(s);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const IS_TOUCH='ontouchstart'in window||navigator.maxTouchPoints>0;

// ---------------------------------------------------------------- audio
const AU={ctx:null,master:null,wind:null,windFilter:null,inCandy:false,_nextNote:0};
AU.init=function(){
  if(this.ctx)return;
  const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
  this.master=C.createGain(); this.master.gain.value=.85; this.master.connect(C.destination);
  const len=C.sampleRate*2, buf=C.createBuffer(1,len,C.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=C.createBufferSource(); src.buffer=buf; src.loop=true;
  this.windFilter=C.createBiquadFilter(); this.windFilter.type='lowpass'; this.windFilter.frequency.value=380;
  this.wind=C.createGain(); this.wind.gain.value=.0;
  src.connect(this.windFilter); this.windFilter.connect(this.wind); this.wind.connect(this.master);
  src.start();
};
AU.blip=(f=660,dur=.06,type='square',vol=.05)=>{
  if(!AU.ctx)return; const C=AU.ctx,o=C.createOscillator(),g=C.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,C.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+dur);
  o.connect(g); g.connect(AU.master);o.start();o.stop(C.currentTime+dur+.02);
};
AU.boom=()=>{ if(!AU.ctx)return; const C=AU.ctx,t=C.currentTime;
  const o=C.createOscillator(),g=C.createGain();
  o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(28,t+.6);
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);
  o.connect(g); g.connect(AU.master);o.start(t);o.stop(t+1);
};
AU.shot=()=>{ if(!AU.ctx)return; AU.boom(); AU.blip(1400,.03,'sawtooth',.22); };
AU.chime=()=>{ AU.blip(880,.35,'sine',.06); setTimeout(()=>AU.blip(1320,.4,'sine',.045),160); };
AU.padChord=()=>{ if(!AU.ctx)return; const C=AU.ctx,t=C.currentTime;
  [261.6,329.6,392,523.2].forEach((f,i)=>{
    const o=C.createOscillator(),g=C.createGain();
    o.type='triangle';o.frequency.value=f*(1+(i%2?.0015:-.0015));
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.5);
    g.gain.linearRampToValueAtTime(0,t+3.2);
    o.connect(g); g.connect(AU.master);o.start(t);o.stop(t+3.3);
  });
};
AU.tick=function(dt,t){
  if(!this.ctx)return;
  // ИСПРАВЛЕНО: sin даёт -1..1, из-за чего частота уходила в минус.
  // Теперь (sin+1)/2 даёт 0..1 — частота всегда положительная.
  const base=G.state==='CANDY'?150:380;
  const wob=((Math.sin(t*.4)+1)/2)*140;   // 0..140 вместо -140..140
  this.windFilter.frequency.value=Math.max(40, base+wob+(G.windBoost||0)*2600);
  const windVol=(G.state==='MENU'?.05:G.state==='VOID'?.012:.14)+(G.windBoost||0)*.5;
  this.wind.gain.value+=(windVol-this.wind.gain.value)*Math.min(1,dt*3);
  if(this.inCandy){
    this._nextNote-=dt;
    if(this._nextNote<=0){
      this._nextNote=.42;
      const pent=[523.3,587.3,659.3,784,880];
      const f=pent[Math.floor(Math.random()*pent.length)]*(Math.random()<.2?.5:1);
      this.pluck(f);
    }
  }
};
AU.pluck=function(f){
  const C=this.ctx,o=C.createOscillator(),g=C.createGain(),dl=C.createDelay(1),fb=C.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.05,C.currentTime);g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+.7);
  dl.delayTime.value=.37;fb.gain.value=.34;
  o.connect(g); g.connect(this.master); g.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(this.master);
  o.start();o.stop(C.currentTime+.8);
};

// ------------------------------------------------------------ three.js
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
 $('#app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,1200);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ------------------------------------------------------ текстуры-canvas
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];}
function tx(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function speckle(x,w,h,n,col,aMax){for(let i=0;i<n;i++){x.fillStyle=col;x.globalAlpha=Math.random()*aMax;
  x.fillRect(Math.random()*w,Math.random()*h,rnd(1,4),rnd(1,4));}x.globalAlpha=1;}

function concreteTex(){
  const[c,x]=cvs(256,256);x.fillStyle='#8f8d85';x.fillRect(0,0,256,256);
  speckle(x,256,256,900,'#6f6d66',.25);speckle(x,256,256,300,'#a3a198',.2);
  x.strokeStyle='#77756d';x.lineWidth=1;
  for(let i=0;i<5;i++){x.beginPath();let px=rnd(0,256),py=rnd(0,256);x.moveTo(px,py);
    for(let j=0;j<4;j++){px+=rnd(-40,40);py+=rnd(10,50);x.lineTo(px,py);}x.stroke();}
  return tx(c);
}
function winGrayTex(hue){
  const[c,x]=cvs(128,128);x.fillStyle=hue;x.fillRect(0,0,128,128);
  for(let ry=0;ry<4;ry++)for(let rx=0;rx<4;rx++){
    x.fillStyle=Math.random()<.12?'#9aa0a6':'#4c4f54';
    x.fillRect(14+rx*30,12+ry*30,18,20);
  }
  const t=tx(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function winCandyTex(){
  const[c,x]=cvs(128,128);x.fillStyle='#ffffff';x.fillRect(0,0,128,128);
  for(let ry=0;ry<4;ry++)for(let rx=0;rx<4;rx++){
    x.fillStyle=Math.random()<.75?'#fff3b0':'#cfeee0';
    x.fillRect(12+rx*30,10+ry*30,20,24);
    x.strokeStyle='rgba(0,0,0,.15)';x.lineWidth=3;x.strokeRect(12+rx*30,10+ry*30,20,24);
  }
  const t=tx(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function faceTex(style,color='#1c1c1c'){
  const[c,x]=cvs(128,128);
  x.strokeStyle=color;x.fillStyle=color;x.lineWidth=7;x.lineCap='round';
  if(style==='annoyed'){
    x.beginPath();x.arc(42,48,5,0,7);x.fill();
    x.beginPath();x.arc(86,48,5,0,7);x.fill();
    x.lineWidth=5;
    x.beginPath();x.moveTo(30,32);x.lineTo(52,40);x.stroke();
    x.beginPath();x.moveTo(98,32);x.lineTo(76,40);x.stroke();
    x.beginPath();x.moveTo(48,88);x.quadraticCurveTo(64,78,80,84);x.stroke();
  }else{
    x.beginPath();x.arc(42,48,5,0,7);x.fill();
    x.beginPath();x.arc(86,48,5,0,7);x.fill();
    x.beginPath();x.moveTo(34,74);x.quadraticCurveTo(64,106,94,74);x.stroke();
  }
  return tx(c);
}
function smileBadgeTex(){
  const[c,x]=cvs(64,64);
  x.fillStyle='#ffcf33';x.beginPath();x.arc(32,32,28,0,7);x.fill();
  x.fillStyle='#141414';x.beginPath();x.arc(23,26,4,0,7);x.fill();
  x.beginPath();x.arc(41,26,4,0,7);x.fill();
  x.lineWidth=4;x.strokeStyle='#141414';x.lineCap='round';
  x.beginPath();x.moveTo(20,40);x.quadraticCurveTo(32,50,44,40);x.stroke();
  return tx(c);
}
function maskTex(){
  const[c,x]=cvs(128,160);
  x.fillStyle='#f4f2ec';
  x.beginPath();x.roundRect(8,8,112,144,[56,56,60,60]);x.fill();
  x.strokeStyle='#d8d5cc';x.lineWidth=4;x.stroke();
  x.fillStyle='#1a1a1a';
  x.beginPath();x.ellipse(44,64,13,17,0,0,7);x.fill();
  x.beginPath();x.ellipse(84,64,13,17,0,0,7);x.fill();
  x.lineWidth=8;x.lineCap='round';x.strokeStyle='#1a1a1a';
  x.beginPath();x.moveTo(36,104);x.quadraticCurveTo(64,134,92,104);x.stroke();
  return tx(c);
}
function skyTex(kind){
  const[c,x]=cvs(512,512);
  if(kind==='gray'){
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#7c7e80');g.addColorStop(.55,'#9b9c99');g.addColorStop(1,'#b4b4ae');
    x.fillStyle=g;x.fillRect(0,0,512,512);
    x.fillStyle='rgba(110,112,110,.4)';
    for(let i=0;i<40;i++){x.beginPath();x.ellipse(rnd(0,512),rnd(60,300),rnd(60,160),rnd(8,20),0,0,7);x.fill();}
  }else{
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#2fb4ff');g.addColorStop(.6,'#8fdcff');g.addColorStop(1,'#e6fbff');
    x.fillStyle=g;x.fillRect(0,0,512,512);
    x.fillStyle='#fff6c8';x.beginPath();x.arc(390,110,56,0,7);x.fill();
    x.strokeStyle='#ffd94d';x.lineWidth=10;
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2;
      x.beginPath();x.moveTo(390+Math.cos(a)*72,110+Math.sin(a)*72);
      x.lineTo(390+Math.cos(a)*94,110+Math.sin(a)*94);x.stroke();}
    x.fillStyle='rgba(255,255,255,.92)';
    for(let i=0;i<8;i++){const cx=rnd(30,330),cy=rnd(120,330);
      for(let j=0;j<5;j++){x.beginPath();x.arc(cx+rnd(-45,45),cy+rnd(-12,12),rnd(16,30),0,7);x.fill();}}
  }
  return tx(c);
}

const roofWorld=new THREE.Group(); scene.add(roofWorld);
(function buildRoof(){

  const par=(w,d,x,z)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,1,d),mat('#7b7972'));
    p.position.set(x,60.5,z);p.castShadow=p.receiveShadow=true;roofWorld.add(p);};
  par(22,.5,0,-55.2); par(.5,26,-11,-42); par(.5,26,11,-42);

  const hut=new THREE.Mesh(new THREE.BoxGeometry(4.4,3,3.4),mat('#75736c'));
  hut.position.set(-6,61.3,-49);hut.castShadow=hut.receiveShadow=true;roofWorld.add(hut);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(1.3,2.1),mat('#4b4a46'));
  door.position.set(-6,60.9,-47.28);door.rotation.y=Math.PI;roofWorld.add(door);

    v.position.set(rnd(3,8),60.9,rnd(-52,-46));v.castShadow=true;roofWorld.add(v);

  mast.position.set(7.5,63.4,-52);mast.castShadow=true;roofWorld.add(mast);

  im.count=idx;im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;
  roofWorld.add(im);

  [[30,-24,14,30,16],[-34,-14,16,38,14],[-20,-70,18,44,18],[24,-66,14,36,16],

// ---------------------------------------------------------- фабрика людей
function makeHumanoid(o={}){
  const g=new THREE.Group();
  const M=(c,r=.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
  const pants=M(o.pantsCol||'#3f4a5a',.8), skin=M(o.skin||'#e8b896',.7);
  const suit=M(o.jumpsuit||'#8a5a3a',.75);
  const mkLeg=s=>{const geo=new THREE.CylinderGeometry(.085,.075,.8,8);geo.translate(0,-.4,0);
    const m=new THREE.Mesh(geo,pants);m.position.set(.12*s,.8,0);m.castShadow=true;return m;};
  const legL=mkLeg(1),legR=mkLeg(-1);g.add(legL,legR);
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.5,.6,.26),suit);
  torso.position.y=1.12;torso.castShadow=true;g.add(torso);
  const mkArm=s=>{const geo=new THREE.CylinderGeometry(.06,.055,.62,8);geo.translate(0,-.31,0);
    const pv=new THREE.Group();pv.position.set(.3*s,1.4,0);
    const m=new THREE.Mesh(geo,suit);m.castShadow=true;pv.add(m);g.add(pv);return pv;};
  const armL=mkArm(1),armR=mkArm(-1);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),skin);hand.position.y=-.62;armR.add(hand);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.21,18,14),skin);
  head.position.y=1.62;head.castShadow=true;g.add(head);
  if(o.hairStyle==='mia'){
    const hr=new THREE.Mesh(new THREE.SphereGeometry(.245,16,12,0,Math.PI*2,0,Math.PI*.62),
      new THREE.MeshStandardMaterial({color:0xff4fa3,roughness:.55}));
    hr.position.y=.03;head.add(hr);
    const bang=new THREE.Mesh(new THREE.BoxGeometry(.4,.1,.16),
      new THREE.MeshStandardMaterial({color:0xff4fa3,roughness:.55}));
    bang.position.set(0,.14,.16);bang.rotation.x=.25;head.add(bang);
    const pony=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),
      new THREE.MeshStandardMaterial({color:0xff4fa3,roughness:.55}));
    pony.position.set(0,-.02,-.26);pony.scale.set(1,1.7,.7);head.add(pony);
  }else{
    const hr=new THREE.Mesh(new THREE.SphereGeometry(.225,14,10,0,Math.PI*2,0,Math.PI*.5),
      M(['#3a2c22','#171310','#6b5638','#8d8d8d'][Math.floor(rnd(0,4))],.8));
    hr.position.y=.02;head.add(hr);
  }
  const face=new THREE.Mesh(new THREE.PlaneGeometry(.3,.3),
    new THREE.MeshBasicMaterial({map:faceTex(o.hairStyle==='mia'?'annoyed':'smile'),
      transparent:true,side:THREE.DoubleSide}));
  face.position.set(0,1.64,.19);face.renderOrder=2;g.add(face);
  g.traverse(m=>{if(m.isMesh)m.castShadow=true;});
  return {g,head,torso,legL,legR,armL,armR,hand,phase:rnd(0,6.28),dance:0,moving:false,walkT:0};
}
function makeYellow(){

  y.g.scale.setScalar(1.12);
  const bMat=()=>new THREE.MeshBasicMaterial({map:smileBadgeTex(),transparent:true,side:THREE.DoubleSide});
  const badge=new THREE.Mesh(new THREE.PlaneGeometry(.26,.26),bMat());
  badge.position.set(0,1.2,.145);y.g.add(badge);
  const badge2=new THREE.Mesh(new THREE.PlaneGeometry(.26,.26),bMat());
  badge2.position.set(0,1.2,-.145);badge2.rotation.y=Math.PI;y.g.add(badge2);
  const baton=new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.55,8),
    new THREE.MeshStandardMaterial({color:0x222222,roughness:.4}));
  baton.position.set(0,-.66,.02);baton.rotation.x=.2;y.armR.add(baton);
  const toy=new THREE.Group();
  toy.add(new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),
    new THREE.MeshStandardMaterial({color:0xa8845c,roughness:.9})));
  [.06,-.06].forEach(dx=>{
    const ear=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.1,6),
      new THREE.MeshStandardMaterial({color:0xa8845c,roughness:.9}));

  const stC=(()=>{const[c,x]=cvs(64,32);x.strokeStyle='#111';x.lineWidth=4;
    [14,46].forEach(ex=>{x.beginPath();x.moveTo(ex-5,5);x.lineTo(ex+5,13);x.stroke();

  const st=new THREE.Mesh(new THREE.PlaneGeometry(.09,.05),
    new THREE.MeshBasicMaterial({map:stC,transparent:true,side:THREE.DoubleSide}));
  st.position.set(0,.02,.074);toy.add(st);
  toy.position.set(.26,.86,.14);toy.rotation.z=.5;y.g.add(toy);
  return y;
}

const canvas=renderer.domElement;
canvas.addEventListener('click',()=>{
  if(!IS_TOUCH&&(G.state==='ROOF'||G.state==='CANDY')){
    try{canvas.requestPointerLock();}catch(e){}
  }
});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas&&!G.camOverride){
    G.yaw-=e.movementX*.0022;
    G.pitch=clamp(G.pitch-e.movementY*.0022,-1.35,1.35);
  }
});

// --- мобильное управление
const moveVec={x:0,y:0};
if(IS_TOUCH){
  let moveId=null,lookId=null,mBase={x:0,y:0},lLast={x:0,y:0};
  const stick=$('#stickUI');
  canvas.addEventListener('touchstart',e=>{
    for(const t of e.changedTouches){
      if(t.clientX<innerWidth/2&&moveId===null){
        moveId=t.identifier;mBase={x:t.clientX,y:t.clientY};
        stick.style.display='block';stick.style.left=(t.clientX-56)+'px';stick.style.top=(t.clientY-56)+'px';
      }else if(lookId===null){lookId=t.identifier;lLast={x:t.clientX,y:t.clientY};}
    }
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){
      if(t.identifier===moveId){
        let dx=t.clientX-mBase.x,dy=t.clientY-mBase.y;
        const len=Math.hypot(dx,dy)||1,max=46;
        if(len>max){dx*=max/len;dy*=max/len;}
        $('#stickKnob').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
        moveVec.x=dx/max;moveVec.y=dy/max;
      }else if(t.identifier===lookId&&!G.camOverride){
        G.yaw-=(t.clientX-lLast.x)*.005;
        G.pitch=clamp(G.pitch-(t.clientY-lLast.y)*.005,-1.35,1.35);
        lLast={x:t.clientX,y:t.clientY};
      }
    }
  },{passive:true});
  const endT=e=>{for(const t of e.changedTouches){
    if(t.identifier===moveId){moveId=null;moveVec.x=moveVec.y=0;stick.style.display='none';
      $('#stickKnob').style.transform='translate(-50%,-50%)';}
    if(t.identifier===lookId)lookId=null;}};
  canvas.addEventListener('touchend',endT);canvas.addEventListener('touchcancel',endT);
}

// ================================================================= HUD API
function fade(op,ms=1000){const f=$('#fadeBlack');
  f.style.transition=`opacity ${ms}ms ease`;f.style.opacity=op;
  return new Promise(r=>setTimeout(r,ms));}
function flash(op=.9,ms=120){const f=$('#flashWhite');
  f.style.transition='none';f.style.opacity=op;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    f.style.transition=`opacity ${ms}ms ease`;f.style.opacity=0;}));}
let subTimeout=null;
async function say(who,text,hold){
  const w=$('#subsWrap'),s=$('#speaker'),t=$('#subText');
  const names={mia:['МИЯ','mia'],player:['ТЫ','player'],bcast:['ОБЪЯВЛЕНИЕ','bcast'],
               narr:['',''],angry:['НЕЗНАКОМЕЦ','angry']};
  const[label,cls]=names[who]||['',''];
  s.textContent=label;s.className=cls;
  t.textContent=text;w.classList.add('on');
  const dur=hold||(1500+text.length*52);
  clearTimeout(subTimeout);
  await new Promise(r=>{subTimeout=setTimeout(r,dur);});
  w.classList.remove('on');
  await wait(360);
}
function showPrompt(key,label){$('#promptText').textContent=label;
  $('#prompt b').textContent=key;$('#prompt').classList.add('on');}
function hidePrompt(){$('#prompt').classList.remove('on');
  const q=$('#promptQ');q&&q.remove();}
function broadcast(text){const b=$('#broadcast');b.textContent=text;b.classList.add('on');AU.chime();}
function stopBroadcast(){$('#broadcast').classList.remove('on');}
function showCtrl(v){$('#ctrlHint').classList.toggle('on',v);}

function awaitChoice(codes,hints){
  return new Promise(res=>{
    let done=false;
    const finish=code=>{
      if(done)return;done=true;
      G.keyHandler=null;
      document.removeEventListener('pointerdown',tapH);
      res(code);
    };
    G.keyHandler=c=>{if(codes.includes(c))finish(c);};
    const tapH=e=>{finish(codes[0]);};
    document.addEventListener('pointerdown',tapH);
    showPrompt(codes[0].replace('Key',''),hints[0]+
      (codes[1]?`   ·   [${codes[1].replace('Key','')}] ${hints[1]}${IS_TOUCH?' (или просто тапни)':''}`:''));
  });
}

/* --- механика Мии --- */
let walkerPaused=false, miaPath=[], miaTgt=0, miaWayIdx=0;
const yellows=[];                       // заполняется после постройки мира
function fillYellows(){candyWorld.userData.yellows.forEach(y=>yellows.push(y));}
function miaWalkTo(pts){miaPath=pts;miaTgt=1;mia.moving=true;}
function startWalker(i){walkers[i].active=true;walkers[i].t=0;}
function miaWaypoint(i){return new Promise(r=>{
  const iv=setInterval(()=>{if(miaWayIdx>=i){clearInterval(iv);r();}},150);});}
function miaTick(dt){
  if(!miaPath.length||!mia.moving)return;
  const tgt=miaPath[miaTgt];
  const dx=tgt.x-mia.g.position.x,dz=tgt.z-mia.g.position.z;
  const d=Math.hypot(dx,dz);
  if(d<.5){
    miaWayIdx=miaTgt;
    if(miaTgt<miaPath.length-1)miaTgt++;else mia.moving=false;
  }else{
    const sp=2.4*dt;
    mia.g.position.x+=dx/d*sp;mia.g.position.z+=dz/d*sp;
    const ty=Math.atan2(dx,dz);
    let cur=mia.g.rotation.y,diff=((ty-cur+Math.PI)%(Math.PI*2))-Math.PI;
    mia.g.rotation.y=cur+diff*Math.min(1,dt*6);
  }
}

// розовый дым
let smoke=null;
function spawnPinkSmoke(center){
  const n=180,g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3),vel=[];
  for(let i=0;i<n;i++){
    pos[i*3]=center.x+rnd(-.3,.3);pos[i*3+1]=rnd(0,.5);pos[i*3+2]=center.z+rnd(-.3,.3);
    vel.push(new THREE.Vector3(rnd(-.5,.5),rnd(.8,2.2),rnd(-.5,.5)));
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const[c,cx]=cvs(64,64);
  const grd=cx.createRadialGradient(32,32,2,32,32,30);
  grd.addColorStop(0,'rgba(255,158,207,.85)');grd.addColorStop(1,'rgba(255,158,207,0)');
  cx.fillStyle=grd;cx.fillRect(0,0,64,64);
  smoke={pts:new THREE.Points(g,new THREE.PointsMaterial({size:1.6,map:tx(c),transparent:true,
          depthWrite:false,opacity:.9})),vel,life:0,n};
  candyWorld.add(smoke.pts);
}

// ================================================================= главный цикл
const clock=new THREE.Clock();
const tmpO=new THREE.Object3D();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  AU.tick(dt,t);
  G.shake=Math.max(0,G.shake-dt*1.6);

  if(G.state==='MENU'){
    G.menuT+=dt*.06;
    const r=150;
    camera.position.set(Math.sin(G.menuT)*r,110,Math.cos(G.menuT)*r-60);
    camera.lookAt(0,30,-60);
  }

  if(G.state==='ROOF'||G.state==='CANDY'){
    if(G.canMove&&!G.camOverride){
      let mx=0,mz=0;
      if(keys.KeyW||keys.ArrowUp)mz-=1; if(keys.KeyS||keys.ArrowDown)mz+=1;
      if(keys.KeyA||keys.ArrowLeft)mx-=1; if(keys.KeyD||keys.ArrowRight)mx+=1;
      mx+=moveVec.x;mz+=moveVec.y;
      const len=Math.hypot(mx,mz);
      if(len>0){
        const sp=(len>1?len:1)*4.1*dt;
        const sy=Math.sin(G.yaw),cy=Math.cos(G.yaw);
        G.pos.x+=(mx*cy+mz*sy)*sp;
        G.pos.z+=(-mx*sy+mz*cy)*sp;
      }
    }
    if(G.state==='ROOF'){
      G.pos.x=clamp(G.pos.x,-9.4,9.4);
      G.pos.z=clamp(G.pos.z,-51.4,99);
      if(G.edgeCheck)G.edgeCheck();
    }else{
      const d=Math.hypot(G.pos.x,G.pos.z);
      if(d>70){G.pos.x*=70/d;G.pos.z*=70/d;}
      if(G.squareCheck)G.squareCheck();
    }
    camera.position.copy(G.pos);
    camera.rotation.order='YXZ';
    camera.rotation.set(G.pitch,G.yaw,0);
    camera.fov+=(76-camera.fov)*dt*4;camera.updateProjectionMatrix();
  }

  if(G.state==='FALL'){
    G.fall.v+=30*dt;
    G.pos.y-=G.fall.v*dt;
    G.fall.roll+=dt*1.4;
    if(G.fall.pitch<1.45)G.fall.pitch+=dt*1.1;
    camera.position.copy(G.pos);
    camera.rotation.order='YXZ';
    camera.rotation.set(G.fall.pitch,G.yaw,G.fall.roll*.35);
    camera.fov+=(96-camera.fov)*dt*2.5;camera.updateProjectionMatrix();
    if(G.pos.y<12)G.fallResolve&&G.fallResolve();
  }

  if(G.state==='VOID'){
    camera.position.set(Math.sin(t*.5)*.06,1.62+Math.sin(t*.7)*.03,4.4);
    camera.rotation.order='YXZ';
    camera.rotation.set(-.02+Math.sin(t*.4)*.01,Math.PI,0);
    camera.fov+=(62-camera.fov)*dt;camera.updateProjectionMatrix();
    const dd=voidWorld.userData.dots,pa=dd.geometry.attributes.position;
    for(let i=0;i<pa.count;i++){let y=pa.getY(i)+dt*.12;if(y>5)y=0;pa.setY(i,y);}
    pa.needsUpdate=true;
  }

  if(G.shake>0&&G.state!=='FALL'){
    camera.position.x+=rnd(-1,1)*.03*G.shake;
    camera.position.y+=rnd(-1,1)*.03*G.shake;
    camera.rotation.z+=rnd(-1,1)*.006*G.shake;
  }

  if(roofWorld.visible){
    const cars=roofWorld.userData.cars,cm=roofWorld.userData.carsIM;
    cars.forEach((c,i)=>{
      c.t+=c.v*dt; if(c.t>210)c.t=-210; if(c.t<-210)c.t=210;
      if(c.axis==='x')tmpO.position.set(c.t,1,c.lane); else tmpO.position.set(c.lane,1,c.t);
      tmpO.rotation.y=c.axis==='x'?(c.v>0?0:Math.PI):(c.v>0?Math.PI/2:-Math.PI/2);
      tmpO.updateMatrix();cm.setMatrixAt(i,tmpO.matrix);
    });
    cm.instanceMatrix.needsUpdate=true;
    const peds=roofWorld.userData.peds,pm=roofWorld.userData.pedsIM;
    peds.forEach((p,i)=>{
      if(p.along==='x'){p.x+=p.v*dt;if(p.x>190||p.x<-190)p.v*=-1;}
      else{p.z+=p.v*dt;if(p.z>190||p.z<-230)p.v*=-1;}
      tmpO.position.set(p.x,.85,p.z);
      tmpO.updateMatrix();pm.setMatrixAt(i,tmpO.matrix);
    });
    pm.instanceMatrix.needsUpdate=true;
  }

  if(candyWorld.visible){
    crowd.forEach(c=>{
      if(c.balloon){
        if(c.g.userData.baseY===undefined)c.g.userData.baseY=c.g.position.y;
        c.g.position.y=c.g.userData.baseY+Math.sin(t*.8+c.g.userData.ph)*.5;
        c.g.rotation.y+=dt*.1;return;
      }
      c.g.rotation.z=Math.sin(t*c.dance*1.7+c.phase)*.09*c.dance;
      c.g.position.y=Math.abs(Math.sin(t*c.dance*1.7+c.phase))*.06*c.dance;
    });
    if(angryMan&&angryMan.g.visible&&angryMan.g.rotation.x===0){
      angryMan.g.position.x=Math.sin(t*30)*.03;
    }
    walkers.forEach(w=>{
      if(!w.active)return;
      const a=w.path[0],b=w.path[1];
      w.t+=w.speed*dt/a.distanceTo(b);
      if(w.t>=1){w.active=false;return;}
      w.obj.g.position.lerpVectors(a,b,w.t);
      w.obj.g.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);
      w.obj.legL.rotation.x=Math.sin(w.t*22)*.6;
      w.obj.legR.rotation.x=-Math.sin(w.t*22)*.6;
    });
    miaTick(dt);
    if(mia.moving){
      mia.walkT+=dt*9;
      mia.legL.rotation.x=Math.sin(mia.walkT)*.55;
      mia.legR.rotation.x=-Math.sin(mia.walkT)*.55;
      mia.armL.rotation.x=-Math.sin(mia.walkT)*.35;
      mia.g.position.y=Math.abs(Math.sin(mia.walkT))*.045;
    }else{
      mia.legL.rotation.x*=.9;mia.legR.rotation.x*=.9;
    }
    if(maskItem.visible)maskItem.rotation.z=Math.sin(t*2)*.08;
    if(smoke){
      smoke.life+=dt;
      const pa=smoke.pts.geometry.attributes.position;
      for(let i=0;i<smoke.n;i++){
        pa.setX(i,pa.getX(i)+smoke.vel[i].x*dt);
        pa.setY(i,pa.getY(i)+smoke.vel[i].y*dt);
        pa.setZ(i,pa.getZ(i)+smoke.vel[i].z*dt);
        smoke.vel[i].multiplyScalar(1-dt*.35);
      }
      pa.needsUpdate=true;
      smoke.pts.material.opacity=Math.max(0,.9-smoke.life*.12);
    }
  }

  renderer.render(scene,camera);
}
